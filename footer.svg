<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Build. Ship. Research. Mentor." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <clipPath id="f"><rect width="1200" height="140" rx="14"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .wave1 { animation: drift 9s linear infinite; }
    .wave2 { animation: drift 14s linear infinite reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    .blink { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  </style>
  <g clip-path="url(#f)">
    <rect width="1200" height="140" fill="#0d1117"/>
    <g class="wave2" opacity="0.25">
      <path d="M0 95 Q150 55 300 95 T600 95 T900 95 T1200 95 T1500 95 T1800 95 V140 H0Z" fill="url(#a)"/>
    </g>
    <g class="wave1" opacity="0.5">
      <path d="M0 110 Q150 80 300 110 T600 110 T900 110 T1200 110 T1500 110 T1800 110 V140 H0Z" fill="url(#a)"/>
    </g>
    <text x="600" y="58" text-anchor="middle" class="mono" font-size="24" font-weight="700" fill="url(#a)">build · ship · research · mentor</text>
    <text x="600" y="84" text-anchor="middle" class="mono" font-size="14" fill="#8b949e">thanks for stopping by<tspan class="blink" fill="#58a6ff"> _</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="139" rx="14" fill="none" stroke="#30363d"/>
</svg>
