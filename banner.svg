<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Ranadeb Saha - Engineer, Founder, Researcher, Mentor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#151b23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bc8cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c232d" stroke-width="1"/>
    </pattern>
    <clipPath id="reveal">
      <rect x="56" y="110" width="0" height="100">
        <animate attributeName="width" from="0" to="640" dur="1.6s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="frame"><rect width="1200" height="430" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .role { opacity: 0; animation: cycle 12s infinite; }
    .r1 { animation-delay: 2.2s; }
    .r2 { animation-delay: 5.2s; }
    .r3 { animation-delay: 8.2s; }
    .r4 { animation-delay: 11.2s; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(8px); }
      4%   { opacity: 1; transform: translateY(0); }
      21%  { opacity: 1; transform: translateY(0); }
      25%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
    .cursor { opacity: 0; animation: blink 1s steps(1) 2.1s infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    .flow { stroke-dasharray: 5 5; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -10; } }
    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { 0% { transform: translateY(-20px); } 100% { transform: translateY(450px); } }
    .fadein { opacity: 0; animation: fadein .8s ease forwards; }
    @keyframes fadein { to { opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#grid)"/>
    <ellipse class="pulse" cx="1010" cy="170" rx="300" ry="220" fill="url(#glowB)"/>
    <ellipse class="pulse" cx="200" cy="420" rx="320" ry="160" fill="url(#glowP)"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#58a6ff" opacity="0.12"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="429" rx="18" fill="none" stroke="#30363d"/>

  <!-- window chrome -->
  <circle cx="34" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="56" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="78" cy="30" r="6" fill="#27c93f"/>
  <text x="600" y="35" text-anchor="middle" class="mono" font-size="13" fill="#6e7681">ranadeb@devsaha: ~/dossier — zsh</text>

  <!-- prompt -->
  <text x="58" y="98" class="mono" font-size="20" fill="#3fb950">$ <tspan fill="#8b949e">whoami</tspan></text>

  <!-- name (wipe-in reveal) -->
  <g clip-path="url(#reveal)">
    <text x="56" y="186" class="mono" font-size="78" font-weight="800" fill="url(#accent)" letter-spacing="1">RANADEB SAHA</text>
  </g>
  <rect class="cursor" x="712" y="128" width="16" height="62" fill="#58a6ff"/>

  <!-- rotating evergreen roles -->
  <g class="mono" font-size="28" fill="#c9d1d9">
    <text x="60" y="244" class="role r1"><tspan fill="#58a6ff">&gt;</tspan> Full-Stack Engineer</text>
    <text x="60" y="244" class="role r2"><tspan fill="#bc8cff">&gt;</tspan> Agency Founder · DevSaha Tech</text>
    <text x="60" y="244" class="role r3"><tspan fill="#3fb950">&gt;</tspan> AI · CV · MLLM Researcher</text>
    <text x="60" y="244" class="role r4"><tspan fill="#d29922">&gt;</tspan> Mentor &amp; Community Builder</text>
  </g>

  <!-- static evergreen stack line -->
  <text x="60" y="282" class="mono fadein" style="animation-delay:2s" font-size="15" fill="#6e7681">Django · React · Node.js · PostgreSQL · YOLOv8 · OCR · Multimodal Learning</text>

  <!-- orbit decoration -->
  <g transform="translate(1020 165)" opacity="0.9">
    <circle r="62" fill="none" stroke="#30363d" stroke-dasharray="3 6"/>
    <circle r="100" fill="none" stroke="#30363d" stroke-dasharray="3 6"/>
    <circle r="140" fill="none" stroke="#21262d"/>
    <circle r="16" fill="url(#accent)"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <circle cx="62" cy="0" r="7" fill="#58a6ff"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="22s" repeatCount="indefinite"/>
      <circle cx="100" cy="0" r="8" fill="#bc8cff"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="240" to="-120" dur="30s" repeatCount="indefinite"/>
      <circle cx="140" cy="0" r="6" fill="#3fb950"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="300" to="660" dur="18s" repeatCount="indefinite"/>
      <circle cx="100" cy="0" r="5" fill="#d29922"/></g>
  </g>

  <!-- four pillars -->
  <g class="mono">
    <rect x="58" y="320" width="240" height="66" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-opacity="0.7"/>
    <text x="78" y="348" font-size="17" font-weight="700" fill="#58a6ff">{ } ENGINEER</text>
    <text x="78" y="371" font-size="12.5" fill="#8b949e">systems that scale</text>

    <rect x="338" y="320" width="240" height="66" rx="10" fill="#0d1117" stroke="#bc8cff" stroke-opacity="0.7"/>
    <text x="358" y="348" font-size="17" font-weight="700" fill="#bc8cff">▲ FOUNDER</text>
    <text x="358" y="371" font-size="12.5" fill="#8b949e">DevSaha Tech · MSME</text>

    <rect x="618" y="320" width="240" height="66" rx="10" fill="#0d1117" stroke="#3fb950" stroke-opacity="0.7"/>
    <text x="638" y="348" font-size="17" font-weight="700" fill="#3fb950">◈ RESEARCHER</text>
    <text x="638" y="371" font-size="12.5" fill="#8b949e">MLLM · OCR · vision</text>

    <rect x="898" y="320" width="244" height="66" rx="10" fill="#0d1117" stroke="#d29922" stroke-opacity="0.7"/>
    <text x="918" y="348" font-size="17" font-weight="700" fill="#d29922">✦ MENTOR</text>
    <text x="918" y="371" font-size="12.5" fill="#8b949e">lifting other builders</text>
  </g>
  <g stroke-width="2" fill="none">
    <line class="flow" x1="298" y1="353" x2="338" y2="353" stroke="#58a6ff"/>
    <line class="flow" x1="578" y1="353" x2="618" y2="353" stroke="#bc8cff"/>
    <line class="flow" x1="858" y1="353" x2="898" y2="353" stroke="#3fb950"/>
  </g>

  <!-- status strip -->
  <g class="mono" font-size="13">
    <circle class="pulse" cx="64" cy="408" r="4.5" fill="#3fb950"/>
    <text x="78" y="412" fill="#8b949e">available · hiring · freelance · research</text>
    <text x="1142" y="412" text-anchor="end" fill="#6e7681">GATE 2026 Qualified · CS &amp; IT</text>
  </g>

  <rect x="0" y="422" width="1200" height="8" fill="url(#accent)"/>
</svg>
